name: Render Keep Alive Bot

on:
  schedule:
    # Se ejecuta cada 12 minutos todos los días
    - cron: '*/12 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "ℹ️ Secreto RENDER_APP_URL no configurado aún en GitHub Secrets. Omite este ping."
          else
            echo "Haciendo ping a $RENDER_URL ..."
            curl -s -f "$RENDER_URL/health" || curl -s "$RENDER_URL"
            echo "Ping exitoso. El servidor de Render se mantiene despierto."
          fi